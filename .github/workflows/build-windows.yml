name: Build Mizan DZ for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Tauri CLI
        run: npm install --save-dev @tauri-apps/cli@1.5.11

      - name: Build application
        run: npm run build

      - name: Prepare Tauri resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/resources" | Out-Null

          Invoke-WebRequest `
            -Uri "https://nodejs.org/dist/v22.16.0/win-x64/node.exe" `
            -OutFile "src-tauri/resources/node.exe"

          if (!(Test-Path "src-tauri/resources/node.exe")) {
            Write-Error "node.exe download failed."
            exit 1
          }

          if (!(Test-Path "dist/server.cjs")) {
            Write-Error "dist/server.cjs was not generated by npm run build."
            exit 1
          }

          Copy-Item `
            "dist/server.cjs" `
            "src-tauri/resources/server.cjs" `
            -Force

          if (!(Test-Path "src-tauri/resources/server.cjs")) {
            Write-Error "server.cjs preparation failed."
            exit 1
          }

          if (!(Test-Path "src-tauri/resources/sql-wasm.wasm")) {
            Write-Warning "sql-wasm.wasm is not present in src-tauri/resources."
          }

          Write-Host "Tauri resources prepared successfully."

      - name: Generate Windows icon
        shell: pwsh
        run: |
          python -m pip install --upgrade Pillow

          $ico = "src-tauri/icons/icon.ico"

          python -c "from PIL import Image, ImageDraw; img=Image.new('RGBA',(256,256),(30,30,30,255)); d=ImageDraw.Draw(img); d.rounded_rectangle((20,20,236,236),radius=45,fill=(30,120,80,255)); d.text((72,82),'M',fill=(255,255,255,255),stroke_width=2); img.save(r'src-tauri/icons/icon.ico',format='ICO',sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to generate Windows icon."
            exit 1
          }

          if (!(Test-Path $ico)) {
            Write-Error "icon.ico was not generated."
            exit 1
          }

          Write-Host "Windows icon generated successfully."

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Build Tauri installer
        run: npm run tauri:build

      - name: Verify installers
        shell: pwsh
        run: |
          $exePath = "src-tauri/target/release/bundle/nsis"
          $msiPath = "src-tauri/target/release/bundle/msi"

          $exeFiles = Get-ChildItem `
            -Path $exePath `
            -Filter "*.exe" `
            -ErrorAction SilentlyContinue

          $msiFiles = Get-ChildItem `
            -Path $msiPath `
            -Filter "*.msi" `
            -ErrorAction SilentlyContinue

          if ($exeFiles.Count -eq 0) {
            Write-Error "No EXE installer was generated."
            exit 1
          }

          if ($msiFiles.Count -eq 0) {
            Write-Error "No MSI installer was generated."
            exit 1
          }

          Write-Host "EXE installer:"
          $exeFiles | ForEach-Object {
            Write-Host $_.FullName
          }

          Write-Host "MSI installer:"
          $msiFiles | ForEach-Object {
            Write-Host $_.FullName
          }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Mizan-DZ-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Attach installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
