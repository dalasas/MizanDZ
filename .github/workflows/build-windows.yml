name: Build Mizan DZ for Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Download Node.js runtime for the packaged app
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/resources" | Out-Null

          Invoke-WebRequest `
            -Uri "https://nodejs.org/dist/v22.16.0/win-x64/node.exe" `
            -OutFile "src-tauri/resources/node.exe"

          if (!(Test-Path "src-tauri/resources/node.exe")) {
            throw "node.exe was not downloaded."
          }

          Write-Host "node.exe downloaded successfully."

      - name: Build frontend and production backend
        run: npm run build

      - name: Verify build resources
        shell: powershell
        run: |
          $required = @(
            "dist/index.html",
            "dist/server.cjs",
            "src-tauri/resources/node.exe",
            "src-tauri/resources/server.cjs",
            "src-tauri/resources/sql-wasm.wasm",
            "src-tauri/resources/dist/index.html"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              throw "Required build resource is missing: $file"
            }

            Write-Host "OK: $file"
          }

      - name: Generate Windows application icon
        shell: powershell
        run: |
          python -m pip install Pillow
          python - <<'PY'
          from PIL import Image
          import os

          candidates = [
              "public/logo.png",
              "public/icon.png",
              "src/assets/logo.png",
              "src/assets/icon.png"
          ]

          source = next((p for p in candidates if os.path.exists(p)), None)

          if source is None:
              print("No custom logo found. Tauri will use the existing icon configuration.")
          else:
              os.makedirs("src-tauri/icons", exist_ok=True)
              image = Image.open(source).convert("RGBA")
              image.save("src-tauri/icons/icon.png")
              print(f"Generated icon from {source}")
          PY

      - name: Build Tauri application
        run: npm run tauri:build

      - name: Verify Windows installers
        shell: powershell
        run: |
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -ErrorAction SilentlyContinue
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue

          if (!$msi) {
            throw "MSI installer was not created."
          }

          if (!$nsis) {
            throw "NSIS installer was not created."
          }

          Write-Host "MSI installer:"
          $msi | ForEach-Object { Write-Host $_.FullName }

          Write-Host "NSIS installer:"
          $nsis | ForEach-Object { Write-Host $_.FullName }

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Mizan-DZ-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
